name: cortana-mcp

services:
  notion-mcp:
    build:
      context: ./container/notion-mcp
    image: nanoclaw-notion-mcp:latest
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN}
    command: ["--transport", "http", "--port", "3000", "--auth-token", "${NOTION_MCP_AUTH_TOKEN}"]
    restart: unless-stopped
    networks:
      - cortana-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  google-workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:latest
    environment:
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - TRANSPORT=http
      - PORT=3005
      - AUTH_TOKEN=${GOOGLE_MCP_AUTH_TOKEN}
    volumes:
      - ./data/gworkspace-creds:/home/app/.google_workspace_mcp/credentials
    ports:
      - "127.0.0.1:3005:3005"
    restart: unless-stopped
    networks:
      - cortana-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - cortana-net
      - cortana-db-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  mem0-mcp:
    build:
      context: C:/workspace/claude/mem0/openmemory/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - mem0_data:/usr/src/openmemory/data
    environment:
      - USER=yung
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=sqlite:///./data/openmemory.db
      - OPENAI_API_KEY=
    env_file:
      - C:/workspace/claude/mem0/openmemory/api/.env
    depends_on:
      - qdrant
    networks:
      - cortana-net
      - cortana-kb-net
      - cortana-db-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    volumes:
      - ./data/kb/falkordb:/data
    networks:
      - cortana-db-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPENAI_API_KEY=ollama
      - OPENAI_API_URL=http://host.docker.internal:11434/v1
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - FALKORDB_URI=redis://falkordb:6379
      - FALKORDB_DATABASE=default_db
      - GRAPHITI_GROUP_ID=cortanakb
      - SEMAPHORE_LIMIT=10
      - CONFIG_PATH=/app/mcp/config/config.yaml
    volumes:
      - ./config/graphiti-config.yaml:/app/mcp/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      falkordb:
        condition: service_healthy
    networks:
      - cortana-net
      - cortana-kb-net
      - cortana-db-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qdrant_storage:
  mem0_data:

networks:
  cortana-net:
    external: true
  cortana-kb-net:
    name: cortana-kb-net
    internal: true
    driver: bridge
  cortana-db-net:
    name: cortana-db-net
    internal: true
    driver: bridge
